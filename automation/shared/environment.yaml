name: momentbook-guide-mobile-chat
version: 8
purpose: Support mobile/chat-driven Momentbook guide writing, production API publication, review, and optional git persistence.

local_workspace:
  path: .
  repository: momentbook-guide
  branch: main
  remote: origin

production:
  api_base_url: https://api.momentbook.app
  auth_endpoint: /v2/auth/email/login
  articles_endpoint: /v2/admin/articles
  credential_file: .codex/automation/admin-api.env
  direct_ssh: false
  direct_db_access: false
  publish_target: production_only
  scope: verified_translationGroupId_only

execution:
  mode: mobile_chat
  recurring_automations_active: false
  one_translation_group_per_request: true
  commit_and_push: only_when_requested_in_chat

date_policy:
  timezone: Asia/Seoul
  written_date_source: chat_runtime_clock
  written_date_format: YYYY-MM-DD
  sourceCheckedDate: same_as_actual_source_check_local_date
  slug_date_if_present: same_as_written_date
  publishedAt: actual_production_api_write_timestamp
  future_publishedAt_allowed: false

required_languages:
  - ko
  - en
  - ja
  - zh
  - es
  - pt
  - fr
  - th
  - vi

quality_gates:
  - official_source_gate
  - date_gate
  - article_contract_gate
  - readability_gate
  - localization_gate
  - semantic_parity_gate
  - automated_article_quality_gate
  - production_admin_api_verification

active_contracts:
  mobile_chat: prompts/mobile-chat.md
  publisher_contract: prompts/guide-publisher.md
  admin_articles_api: automation/shared/admin-articles-api.md
  article_writing_standard: automation/shared/article-writing-standard.md
  content_repair_workflow: automation/shared/content-repair-workflow.md
  authoring_guide: playbooks/authoring-guide.md
  registry: registry/editorial-guide-registry.md

review_patch_policy:
  writable_fields:
    - title
    - body
  preserve_metadata:
    - translationGroupId
    - language
    - slug
    - category
    - status
    - publishedAt
    - createdAt

git_persistence:
  mode: chat_requested
  remote: origin
  branch: main
  author_name: DeepSeek
  author_email: deepseek@deepseek.com
  author: DeepSeek <deepseek@deepseek.com>
  never_force_push: true
  allowed_durable_paths:
    - registry/editorial-guide-registry.md
    - .automation/post-publish-review-state.json
  ignored_runtime_paths:
    - .automation/runs/
    - .automation/review-runs/
    - .tmp/

final_report:
  include:
    - task_result
    - translationGroupId
    - language_coverage
    - source_pack_summary
    - article_contract_gate_result
    - quality_gate_results
    - production_admin_api_verification
    - review_patch_summary
    - durable_files_changed
    - git_status_when_requested
    - residual_risks
