name: momentbook-guide-local-automation
version: 6
purpose: Run guide publication, post-publish review, and git persistence from the local momentbook-guide repository.

local_workspace:
  path: /Users/hansol/workspace/momentbook-guide
  repository: momentbook-guide
  branch: main
  remote: origin

development:
  ssh: ssh momentbook-dev
  guide_workspace: not_used_after_local_migration
  guide_workspace_note: The guide repository is local-only; remove or ignore /home/ubuntu/app/momentbook-guide on development.
  api_workspace: /home/ubuntu/app/momentbook-api
  web_workspace: /home/ubuntu/app/momentbook-web

production:
  ssh: ssh momentbook
  db_only: true
  leave_files: false
  replication_scope: verified_translationGroupId_only

schedules_asia_seoul:
  guide_publisher: "00:00, 06:00, 12:00, 18:00"
  post_publish_review: "01:00, 07:00, 13:00, 19:00"
  repo_persistence: "02:00, 08:00, 14:00, 20:00"

date_policy:
  timezone: Asia/Seoul
  written_date_source: automation_runtime_clock
  written_date_format: YYYY-MM-DD
  set_written_date_in_prompt: true
  hardcoded_written_date_in_article_markdown: false
  sourceCheckedDate: same_as_actual_source_check_local_date
  slug_date_if_present: same_as_written_date
  publishedAt: actual_db_write_timestamp
  future_publishedAt_allowed: false

tasks:
  guide_publisher:
    prompt: automation/tasks/guide-publisher/prompt.md
    workflow: automation/tasks/guide-publisher/workflow.md
    lock_path: .automation/guide-publisher.lock
    run_base_path: .automation/runs
    durable_outputs:
      - registry/editorial-guide-registry.md
    git_commit_or_push: false

  post_publish_review:
    prompt: automation/tasks/post-publish-review/prompt.md
    workflow: automation/tasks/post-publish-review/workflow.md
    lock_path: .automation/post-publish-review.lock
    run_base_path: .automation/review-runs
    state_path: .automation/post-publish-review-state.json
    candidate_window_hours: 8
    min_candidate_age_minutes: 10
    skip_reviewed_groups: true
    durable_outputs:
      - .automation/post-publish-review-state.json
    git_commit_or_push: false

  repo_persistence:
    prompt: automation/tasks/repo-persistence/prompt.md
    workflow: automation/tasks/repo-persistence/workflow.md
    git_only: true
    runs_after_review_minutes: 60
    commit_and_push: true

concurrency:
  allow_overlap: false
  stale_lock_after_minutes: 360
  remove_lock_after_run: true

required_languages:
  - ko
  - en
  - ja
  - zh
  - es
  - pt
  - fr
  - th
  - vi

quality_gates:
  - official_source_gate
  - date_gate
  - article_contract_gate
  - readability_gate
  - localization_gate
  - semantic_parity_gate
  - automated_article_quality_gate
  - dev_db_verification
  - prod_db_verification

active_contracts:
  run_contract: automation/shared/run-contract.md
  article_writing_standard: automation/shared/article-writing-standard.md
  authoring_guide: playbooks/authoring-guide.md
  publisher_contract: prompts/guide-publisher.md

review_patch_policy:
  writable_fields:
    - title
    - body
  preserve_metadata:
    - translationGroupId
    - slug
    - category
    - status
    - publishedAt
    - createdAt

git_persistence:
  mode: separate_repo_persistence_task
  remote: origin
  branch: main
  author_name: Codex
  author_email: codex@openai.com
  author: Codex <codex@openai.com>
  never_force_push: true
  allowed_paths:
    - registry/editorial-guide-registry.md
    - .automation/post-publish-review-state.json
  ignored_runtime_paths:
    - .automation/guide-publisher.lock
    - .automation/post-publish-review.lock
    - .automation/runs/
    - .automation/review-runs/

final_report:
  include:
    - task_result
    - translationGroupId
    - language_coverage
    - article_contract_gate_result
    - quality_gate_results
    - dev_db_verification
    - prod_db_verification
    - durable_files_changed
    - git_persistence_status
    - residual_risks
